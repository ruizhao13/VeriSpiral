name: VeriSpiral quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: verispiral-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and check the public command
        run: |
          python -m pip install .
          verispiral --help
      - name: Exercise installed demos outside the checkout
        run: |
          installed_demo_dir="$(mktemp -d)"
          cd "$installed_demo_dir"
          verispiral demo --output candidate-output
          verispiral research-loop --output research-loop-output
          verispiral evolve --output evolution-output
          verispiral minimax --output minimax-output
      - name: Verify tests, golden artifacts, demos, and release boundary
        run: make verify golden-check
